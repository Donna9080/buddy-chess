<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddy — Chess for Friends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">Buddy</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
  </header>

  <main>
    <section class="hero">
      <h1>Chess, with a friend, right now</h1>
      <p class="tagline">No accounts, no setup — just pick a way to play.</p>
    </section>

    <div class="mode-grid">
      <a class="mode-card" href="hotseat.html">
        <span class="mode-icon">♟︎♟︎</span>
        <span class="mode-title">Play Together</span>
        <span class="mode-desc">Two people, one screen, take turns.</span>
      </a>
      <a class="mode-card" href="vscomputer.html">
        <span class="mode-icon">♞</span>
        <span class="mode-title">Play Computer</span>
        <span class="mode-desc">Pick a side and a difficulty.</span>
      </a>
      <a class="mode-card" href="online.html">
        <span class="mode-icon">♛</span>
        <span class="mode-title">Play Online</span>
        <span class="mode-desc">Type a room code, play a friend.</span>
      </a>
      <a class="mode-card" href="tutor.html">
        <span class="mode-icon">♝</span>
        <span class="mode-title">Chess Coach</span>
        <span class="mode-desc">Get coached on your best move.</span>
      </a>
    </div>
  </main>

  <script type="module" src="js/theme-switcher.js"></script>
</body>
</html>
