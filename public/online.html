<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddy — Play Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">Buddy</a>
    <h1>Play Online</h1>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
  </header>

  <main>
    <section id="join" class="setup">
      <p>Type any room code — the first person to use it plays White, the
        second plays Black. Share the same code with a friend to play them.</p>
      <label>
        Room code
        <input type="text" id="room-code-input" class="room-code-input" maxlength="12" placeholder="e.g. BUDDY42">
      </label>
      <button type="button" id="join-button" class="primary-button">Join Room</button>
    </section>

    <section id="game" class="game-area" hidden>
      <div class="room-banner">
        <span>Room: <strong id="room-code-display"></strong></span>
        <span id="seat-label"></span>
      </div>
      <div class="board-wrapper">
        <div id="board" class="board" aria-label="Chess board"></div>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <button type="button" id="new-game-button" class="primary-button">New Game</button>
    </section>
  </main>

  <script type="module" src="js/theme-switcher.js"></script>
  <script type="module" src="js/online.js"></script>
</body>
</html>
