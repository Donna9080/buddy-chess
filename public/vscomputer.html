<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddy — Play Computer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">Buddy</a>
    <h1>Play Computer</h1>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
  </header>

  <main>
    <section id="setup" class="setup">
      <fieldset>
        <legend>Play as</legend>
        <label><input type="radio" name="color" value="w" checked> White</label>
        <label><input type="radio" name="color" value="b"> Black</label>
      </fieldset>
      <fieldset>
        <legend>Difficulty</legend>
        <label><input type="radio" name="difficulty" value="1"> Easy</label>
        <label><input type="radio" name="difficulty" value="2" checked> Medium</label>
        <label><input type="radio" name="difficulty" value="3"> Hard</label>
      </fieldset>
      <button type="button" id="start-button" class="primary-button">Start Game</button>
    </section>

    <section id="game" class="game-area" hidden>
      <div class="board-wrapper">
        <div id="board" class="board" aria-label="Chess board"></div>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="js/theme-switcher.js"></script>
  <script type="module" src="js/vscomputer.js"></script>
</body>
</html>
