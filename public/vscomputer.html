<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddy — Vs Computer</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme-adult.css">
  <link rel="stylesheet" href="css/theme-children.css">
  <link rel="stylesheet" href="css/theme-cool.css">
  <link rel="stylesheet" href="css/theme-messy.css">
  <link rel="stylesheet" href="css/theme-professional.css">
</head>
<body class="theme-adult">
  <header class="app-header">
    <a href="index.html">Buddy</a>
    <h1>Vs Computer</h1>
    <div id="theme-switcher" class="theme-switcher" aria-label="Choose a theme"></div>
  </header>

  <main>
    <section id="setup" class="setup">
      <fieldset>
        <legend>Play as</legend>
        <label><input type="radio" name="color" value="w" checked> White</label>
        <label><input type="radio" name="color" value="b"> Black</label>
      </fieldset>
      <fieldset>
        <legend>Difficulty</legend>
        <label><input type="radio" name="difficulty" value="1"> Easy</label>
        <label><input type="radio" name="difficulty" value="2" checked> Medium</label>
        <label><input type="radio" name="difficulty" value="3"> Hard</label>
      </fieldset>
      <button type="button" id="start-button">Start Game</button>
    </section>

    <section id="game" hidden>
      <div id="board" class="board" aria-label="Chess board"></div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="js/theme-switcher.js"></script>
  <script type="module" src="js/vscomputer.js"></script>
</body>
</html>
